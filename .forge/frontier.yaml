product_goal: 'Make forge-loop a resumable, self-improving autonomous loop: it ships
  PRs from well-specified issues, recovers from crashes, converges its own operational
  state, and gets measurably better from its own outcomes.'
current_problem: >-
  The outer loop is open in TWO directions and both showed up empirically. (1) The
  CHECK/measurement arc: the durable event log has 500+ rows of merge/critic/task
  outcomes but projection_cursors is empty — nothing measures whether the loop's
  output is improving, so the self-improvement claim is unfalsifiable. (2) The
  CONVERGENCE/maintenance arc: the loop generates faster than it garbage-collects.
  Left running it accreted ~120 branches, unreaped worktrees, 17 open epics (growing
  monotonically), and a shared checkout drifted onto a feature branch — operational
  entropy, because generation pressure has no matching GC pressure
  (maintenance_every_n_ticks was 0). Both are missing RETURN arcs: the system Plans
  and Does but does not Check or Act on its own state. A ruthless manual cleanup
  reset it to one branch / clean backlog; the product fix is to make that GC autonomous.
next_expansion: >-
  Wire BOTH return arcs, measurement first because it is the prerequisite signal.
  (A) Register the Scorecard projection on the existing replay framework (the reserved
  seam in build_boot_sources) to derive first-pass acceptance, repair-rounds, sev2-
  regeneration, lead time and abandonment as a TREND. (B) Wire operational convergence:
  enable the maintenance role (now on), branch-GC on issue-closed, worktree-GC against
  the live lease set, a backlog ceiling on brainstorm, a restore-base_branch checkout
  invariant, and an operational-entropy metric. Both are activation of dormant
  scaffolding, not greenfield.
why_now: >-
  The mess was lived, not theorised: stopping the loop required deleting ~120 branches
  and closing 45 issues by hand. The convergence arc is now the most concrete evidence
  the outer loop is open (see paper/10-the-outer-loop.md). Restarting the loop before
  the GC arc is wired just re-starts the entropy generator. Measurement scaffolding
  (Projection protocol, replay, writable FrontierStore) and maintenance scaffolding
  (maintenance role, epic-sweep) all already landed and are verified present.
objective: Close both outer-loop return arcs — make improvement falsifiable AND make
  the loop converge its own operational state — then act on both.
key_result: >-
  (measurement) mean repair-rounds-to-converge trends down across a rolling 20-merge
  window AND sev2-regeneration stays flat-or-down, derived by the Scorecard projection;
  AND (convergence) open-branch / live-worktree / open-epic counts stay bounded under
  a ceiling across a multi-tick run with maintenance enabled — both checked before any
  frontier.advance fires.
active_decisions:
- Context windows are working memory, not durable state; externalise cognition to
  .forge.
- Workers are disposable and leased; control-plane state is external and replayable.
- The maestro stays stateless deterministic code; context-pressure self-compaction
  belongs to long-lived worker sessions, not the maestro.
- Durable cognition is committed as text; runtime journal (events.db) and transient
  sagas (tasks.db) stay local.
- Close the outer loop by ACTIVATING dormant scaffolding, never rebuilding it
  (anti-reinvention); measurement (Check) precedes prescription (Act).
- Act-on-direction must be evidence-gated and reversible — no frontier.advance
  unless the KR is met across the window; the prior cursor stays recoverable.
- Generation must be matched by convergence — every arc that creates state (branches,
  worktrees, backlog, checkout) needs a paired GC arc, or operational entropy wins.
- Do NOT restart the autonomous loop until the convergence/GC arcs are wired; an
  ungoverned generator re-accretes the mess within hours.
rejected_paths:
- idea: commit binary sqlite stores (memory.db / events.db) to git
  reason: no diffs, merge conflicts, repo bloat; events.db rotates at 10MB
  revisit_if: a committed text export proves insufficient for the single-maintainer
    .forge
- idea: ask the model how full its context window is
  reason: model self-report on its own context is unreliable; use the SDK get_context_usage
    percentage instead
  revisit_if: ''
- idea: shorten the worker lease TTL without heartbeats
  reason: a live worker would be reaped as stale; heartbeats are the prerequisite
  revisit_if: ''
- idea: build a bespoke "strategist agent" to pick the frontier
  reason: reinvents proven human structure (PDCA / OKR / retro) AND duplicates
    dormant in-repo scaffolding; the retro is a wiring job, not a new agent
  revisit_if: the wired evidence-gated frontier-advance proves insufficient in practice
- idea: leave operational cleanup (branches/worktrees/backlog) as a manual operator chore
  reason: it does not scale and re-accretes every run; the loop must GC its own exhaust
    autonomously (operational-convergence axis)
  revisit_if: ''
hot_files:
- ref: src/forge_loop/eventlog/projections.py
  why_hot: the Projection/replay framework the Scorecard plugs into (no concrete
    metric projection registered yet)
- ref: src/forge_loop/control/boot.py
  why_hot: build_boot_sources holds the single reserved seam to register the
    Scorecard projection; drives projections to tail
- ref: src/forge_loop/frontier/store.py
  why_hot: writable cursor (load/save) + the OKR round-trip for value-ranking and
    the frontier-advance policy
- ref: src/forge_loop/brainstormer.py
  why_hot: add value/effort ranking + a TOTAL-backlog ceiling so refill cannot run
    the epic count unbounded (the convergence arc on generation)
- ref: src/forge_loop/runner/tick.py
  why_hot: the maintenance hook (maintenance_every_n_ticks) is where branch-GC /
    worktree-GC / checkout-restore must run each maintenance tick
- ref: src/forge_loop/console_api.py
  why_hot: the read API that should also surface the operational-entropy metric
    (open branches / worktrees / epics) the convergence KR is checked against
hot_tests:
- ref: tests/test_recovery.py
  why_hot: resumability / dead-worker reconciliation invariants
- ref: tests/test_console_api.py
  why_hot: the lease-reconciliation primitive (zombie-worker fix) the worktree-GC reuses
open_questions:
- '$/merged-PR has no cost signal in event payloads — what records per-task cost,
  and where does it attach? (parked; ship the other five metrics first)'
- Which KR balancing-pair best resists Goodhart (repair-rounds + sev2-regen vs
  acceptance-alone)?
- 'Memory persistence: committed text export vs single-maintainer binary memory.db?'
- What is the right backlog ceiling + epic TTL so brainstorm refills without re-accreting
  the 17-epic pile?
