product_goal: 'Make forge-loop a resumable, self-improving autonomous loop: it ships
  PRs from well-specified issues, recovers from crashes, and gets measurably better
  from its own outcomes.'
current_problem: >-
  The outer PDCA loop is open: Check and Act-on-direction are scaffolded but
  switched off. The durable event log has 267+ rows of merge/critic/task outcomes
  and grows every tick via LegacyEventMirror, but projection_cursors is empty —
  nothing measures whether the loop's own output is improving, so the
  self-improvement claim is currently unfalsifiable. Plan-intent (axes/vision)
  and Act-on-quality (the manifesto ratchet) exist; the return arcs do not.
next_expansion: >-
  Register the Scorecard projection on the existing replay framework (the single
  reserved seam in build_boot_sources) to derive first-pass critic acceptance,
  repair-rounds-to-converge, sev2-regeneration, lead time and abandonment as a
  TREND; then gate a reversible frontier-advance policy (emitting the reserved
  frontier.advanced event) and value-ranked brainstorming on that curve. This is
  activation/wiring of dormant scaffolding, not greenfield.
why_now: >-
  The durable log, the Projection protocol, replay_projection, the writable
  FrontierStore, the reserved FRONTIER_ADVANCED kind, and the manifesto ratchet
  all already landed and are verified present but unwired. The data to measure
  from already exists; measurement-first because every downstream arc is
  unfalsifiable noise until the trend curve exists to gate it.
objective: Make recursive self-improvement falsifiable, then act on it.
key_result: >-
  mean repair-rounds-to-converge trends down across a rolling 20-merge window
  AND sev2-regeneration rate stays flat-or-down, both derived by the Scorecard
  projection — checked before any frontier.advance fires. (Typed objective/
  key_result fields land with the value-ranking ticket; until then these are
  documented intent the loader ignores.)
active_decisions:
- Context windows are working memory, not durable state; externalise cognition to
  .forge.
- Workers are disposable and leased; control-plane state is external and replayable.
- The maestro stays stateless deterministic code; context-pressure self-compaction
  belongs to long-lived worker sessions, not the maestro.
- Durable cognition is committed as text; runtime journal (events.db) and transient
  sagas (tasks.db) stay local.
- Close the outer loop by ACTIVATING dormant scaffolding, never rebuilding it
  (anti-reinvention); measurement (Check) precedes prescription (Act).
- Act-on-direction must be evidence-gated and reversible — no frontier.advance
  unless the KR is met across the window; the prior cursor stays recoverable.
rejected_paths:
- idea: commit binary sqlite stores (memory.db / events.db) to git
  reason: no diffs, merge conflicts, repo bloat; events.db rotates at 10MB
  revisit_if: a committed text export proves insufficient for the single-maintainer
    .forge
- idea: ask the model how full its context window is
  reason: model self-report on its own context is unreliable; use the SDK get_context_usage
    percentage instead
  revisit_if: ''
- idea: shorten the worker lease TTL without heartbeats
  reason: a live worker would be reaped as stale; heartbeats are the prerequisite
  revisit_if: ''
- idea: build a bespoke "strategist agent" to pick the frontier
  reason: reinvents proven human structure (PDCA / OKR / retro) AND duplicates
    dormant in-repo scaffolding; the retro is a wiring job, not a new agent
  revisit_if: the wired evidence-gated frontier-advance proves insufficient in practice
hot_files:
