name: ci

# Issue #90: gate every PR + push to trunk on ruff, mypy, pyright, pytest.
# Coverage floor enforces no regression vs the current measured value.

on:
  push:
    branches: [trunk]
  pull_request:
    branches: [trunk]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "latest"

      - name: Set up Python via uv
        run: uv python install 3.11

      - name: Install deps
        run: uv sync --all-extras

      - name: ruff format check
        run: uv run ruff format --check src/ tests/

      - name: ruff lint
        run: uv run ruff check src/ tests/

      - name: mypy
        # NOTE: not yet --strict — issue #90 ships infrastructure; the
        # ~60 existing strict-mode errors get fixed in a follow-up PR
        # named "fix(types): mypy strict cascade". CI gates the floor.
        run: uv run mypy src/forge_loop/

      - name: pyright
        run: uv run pyright

      - name: pytest with coverage floor
        run: |
          uv run pytest tests/ \
            --cov=src/forge_loop \
            --cov-report=term-missing \
            --cov-fail-under=70 \
            -W ignore::DeprecationWarning
