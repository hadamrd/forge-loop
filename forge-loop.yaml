# forge-loop dogfood configuration.
#
# Operator-local overrides belong in `forge-loop.local.yaml` or env vars.
# Keep this file conservative: it should support bounded self-dogfood runs
# without depending on a private machine layout.

repo:
  github: hadamrd/forge-loop
  base_branch: trunk
  worktree_root: /tmp

deploy:
  task: ""

scheduling:
  parallel: 1
  tick_interval_s: 60
  worker_timeout_s: 3600
  max_ticks: 1
  # Operational-convergence axis: the maintenance role runs the GC arcs (epic-sweep,
  # and — once wired — branch/worktree GC + checkout-restore). 0 disabled it, which
  # is how the loop accreted ~120 branches + 17 epics. Run it every N ticks.
  maintenance_every_n_ticks: 5

labels:
  ready: "loop:ready"
  triage: "loop:triage"
  blocked: "loop:blocked"
  risk_gate: "risk:high"

agent:
  provider: codex

worker:
  provider: codex
  model: ""
  thinking: medium
  # Worker environment contract — DECLARE + PREFLIGHT the toolchain so a
  # worker never silently inherits the orchestrator's ambient env (the
  # 2026-06-05 silent-toolchain incident). See forge_loop.worker_env.
  env:
    path_prepend: [".venv/bin"]
    vars: { VIRTUAL_ENV: ".venv" }
    require: [python, ruff, pytest, pyright]
  verify: ["ruff check src tests", "pyright src/forge_loop", "python -m pytest -q"]

po:
  enabled: false
  provider: codex
  model: ""
  thinking: high
  timeout_s: 600

critic:
  provider: codex
  model: ""
  thinking: off

lumen:
  top_k: 3
  test_pattern: "tests/test_*.py"
