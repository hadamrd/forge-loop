[project]
name = "forge-loop"
version = "0.1.0"
description = "Autonomous multi-worker dispatcher for Claude Code — picks up GitHub issues by label, dispatches parallel workers in git worktrees, watches PRs, merges, and redeploys."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp >=1.0",
  "pyyaml >=6.0",
  "duckdb >=1.0",
  "anyio >=4.0",
  "anthropic >=0.40",
  "claude-agent-sdk >=0.2",
]

[project.optional-dependencies]
observability = [
  "prometheus_client >=0.20",
  "opentelemetry-api >=1.25",
  "opentelemetry-sdk >=1.25",
  "opentelemetry-exporter-otlp >=1.25",
]
# Optional Redis-backed queue + leader election for multi-host runners
# (issue #19). Default stays in-memory; install with `pip install
# 'forge-loop[redis]'` to enable `forge-loop run --queue redis://...`.
redis = [
  "redis >=5.0",
]
dev = [
  "pytest >=8.0",
  "pytest-cov >=5.0",
  "ruff >=0.6",
  "mypy >=1.10",
  "types-PyYAML >=6.0",
  "fakeredis >=2.20",
  "redis >=5.0",
]

[project.scripts]
forge-loop = "forge_loop.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forge_loop"]

# Brief templates are loaded at runtime via importlib.resources; force-include
# guarantees the .tmpl files ship in the wheel even though hatchling's default
# packaging rules already pick them up (belt and suspenders).
[tool.hatch.build.targets.wheel.force-include]
"src/forge_loop/briefs/worker.md.tmpl" = "forge_loop/briefs/worker.md.tmpl"
"src/forge_loop/briefs/po.md.tmpl" = "forge_loop/briefs/po.md.tmpl"
"src/forge_loop/briefs/critic.md.tmpl" = "forge_loop/briefs/critic.md.tmpl"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]  # line-too-long handled by format

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
