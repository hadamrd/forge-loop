[project]
name = "forge-loop"
version = "0.1.0"
description = "Autonomous multi-worker dispatcher for Claude Code and Codex — picks up GitHub issues by label, dispatches parallel workers in git worktrees, watches PRs, merges, and redeploys."
readme = "README.md"
requires-python = ">=3.11"
# STABLE surface only (issue #39). Anything heavier — fastapi, uvicorn,
# prometheus_client, opentelemetry, jinja2, redis — lives in the
# [experimental] extra and is gated by ``forge_loop._extras``.
dependencies = [
  "mcp >=1.0",
  "pyyaml >=6.0",
  "duckdb >=1.0",
  "anyio >=4.0",
  "anthropic >=0.40",
  "claude-agent-sdk >=0.2",
  # pydantic-settings is the single source of truth for runtime config
  # (issue #84). Replaces the 35-call-site `os.environ.get(...)` sprawl
  # with one typed Settings model. Precedence: env > yaml > defaults.
  "pydantic-settings >=2.0",
  # structlog powers the unified logging surface (issue #89). Rich
  # formatting when stderr is a TTY, JSON when piped to a file. Replaces
  # the print/_mlog/append_event triplet over time.
  "structlog >=24.0",
  # githubkit: typed, async-capable GitHub SDK (issue #83). Replaces the
  # 18 ``subprocess.run(["gh", ...])`` callsites in gh.py with one
  # client; per-call latency drops from ~50-100ms subprocess spawn to
  # an HTTP round-trip the SDK can keep-alive.
  "githubkit >=0.13",
  # Rich powers status/doctor/events output. NO_COLOR aware,
  # CI-friendly when terminal is dumb. Pulled into the stable surface
  # because the CLI is the operator's primary interface.
  "rich >=13.0",
  # Typer drives the CLI parser (issue #47). Pulled into the stable
  # surface because the CLI is operator-facing — switching parsers
  # behind an extras gate would degrade `forge-loop --help` for every
  # default install.
  "typer >=0.12",
]

[project.optional-dependencies]
# All quarantined / experimental features (multirepo, dashboard, async
# orchestrator, slack/discord/webhook adapters, prometheus + otel
# exporters, replay, pipeline DAG) live behind this extra. Install with:
#   pip install 'forge-loop[experimental]'
experimental = [
  "fastapi >=0.110",
  "uvicorn >=0.30",
  "prometheus_client >=0.20",
  "opentelemetry-api >=1.25",
  "opentelemetry-sdk >=1.25",
  "opentelemetry-exporter-otlp >=1.25",
  "jinja2 >=3.1",
]
# Dashboard-only subset (issue #20): operators who just want the
# operator dashboard don't need otel / prometheus / redis. Pulls the
# minimal set the FastAPI app actually imports.
dashboard = [
  "fastapi >=0.110",
  "uvicorn >=0.30",
  "jinja2 >=3.1",
  "python-multipart >=0.0.9",
  "httpx >=0.27",
]
# Optional `[ui]` extra (issue #47) — pulls Textual for the terminal
# dashboard launched via `forge-loop dashboard --tui`. Kept out of the
# stable surface so default installs stay light; the import in cli_tui
# is lazy so cli.py keeps working without it.
ui = [
  "textual >=0.60",
]
dev = [
  "pytest >=8.0",
  # hypothesis powers property-based tests (issue #91) for parsers
  # (events.jsonl reader, fingerprint compute, brief render). Dev-only.
  "hypothesis >=6.0",
  "textual >=0.60",
  "pytest-cov >=5.0",
  "ruff >=0.6",
  "mypy >=1.10",
  "types-PyYAML >=6.0",
  "fastapi >=0.110",
  "uvicorn >=0.30",
  "prometheus_client >=0.20",
  "opentelemetry-api >=1.25",
  "opentelemetry-sdk >=1.25",
  "opentelemetry-exporter-otlp >=1.25",
  "jinja2 >=3.1",
  "python-multipart >=0.0.9",
  "httpx >=0.27",
]

[project.scripts]
forge-loop = "forge_loop.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forge_loop"]

# Brief templates are loaded at runtime via importlib.resources; force-include
# guarantees the .tmpl files ship in the wheel even though hatchling's default
# packaging rules already pick them up (belt and suspenders).
[tool.hatch.build.targets.wheel.force-include]
"src/forge_loop/briefs/worker.md.tmpl" = "forge_loop/briefs/worker.md.tmpl"
"src/forge_loop/briefs/po.md.tmpl" = "forge_loop/briefs/po.md.tmpl"
"src/forge_loop/briefs/critic.md.tmpl" = "forge_loop/briefs/critic.md.tmpl"
"src/forge_loop/roles/builtin/po.yaml" = "forge_loop/roles/builtin/po.yaml"
"src/forge_loop/roles/builtin/worker.yaml" = "forge_loop/roles/builtin/worker.yaml"
"src/forge_loop/roles/builtin/critic.yaml" = "forge_loop/roles/builtin/critic.yaml"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]  # line-too-long handled by format

[tool.ruff.lint.per-file-ignores]
# Experimental modules (issue #39) call the extras gate before any
# other import so an unprepared environment fails fast with a clear
# error rather than crashing partway through a chain of imports. That
# forces E402 / I001 violations that are by-design.
"src/forge_loop/multirepo/__init__.py" = ["E402", "I001"]
"src/forge_loop/dashboard/__init__.py" = ["E402", "I001"]
"src/forge_loop/integrations/__init__.py" = ["E402", "I001"]
"src/forge_loop/observability/__init__.py" = ["E402", "I001"]
"src/forge_loop/pipeline/__init__.py" = ["E402", "I001"]
"src/forge_loop/replay.py" = ["E402", "I001"]
"src/forge_loop/runner_async.py" = ["E402", "I001"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
